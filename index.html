<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bear4w</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background-color: #000000;
      color: #e7e9ea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
    }

    .feed {
      width: 100%;
      max-width: 600px;
      border-left: 1px solid #2f3336;
      border-right: 1px solid #2f3336;
      min-height: 100vh;
    }

    .post {
      padding: 16px;
      border-bottom: 1px solid #2f3336;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1d9bf0, #7856ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      color: #fff;
    }

    .name {
      font-weight: 700;
      font-size: 15px;
      color: #e7e9ea;
    }

    .handle {
      font-size: 14px;
      color: #71767b;
    }

    .btn-follow {
      background-color: #eff3f4;
      color: #0f1419;
      border: 1px solid #eff3f4;
      border-radius: 9999px;
      padding: 7px 16px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: 0.15s;
    }

    .btn-follow:hover {
      background-color: #d7dbdc;
    }

    .btn-follow.following {
      background-color: transparent;
      color: #eff3f4;
      border: 1px solid #536471;
    }

    .text {
      font-size: 15px;
      line-height: 1.45;
      margin: 8px 0 14px;
    }

    .btn-blue {
      display: inline-block;
      background-color: #1d9bf0;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      padding: 10px 22px;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      transition: 0.15s;
    }

    .btn-blue:hover {
      background-color: #1a8cd8;
    }

    .btn-outline {
      display: inline-block;
      background-color: transparent;
      color: #1d9bf0;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      padding: 9px 20px;
      border-radius: 9999px;
      border: 1px solid #536471;
      margin-left: 8px;
      transition: 0.15s;
    }

    .btn-outline:hover {
      background-color: rgba(29, 155, 240, 0.1);
    }

    .actions {
      display: flex;
      justify-content: space-between;
      max-width: 420px;
      margin-top: 16px;
      color: #71767b;
    }

    .action-btn {
      background: none;
      border: none;
      color: #71767b;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 9999px;
      transition: 0.15s;
    }

    .action-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .action-btn.reply:hover { color: #1d9bf0; background: rgba(29, 155, 240, 0.1); }
    .action-btn.repost:hover, .action-btn.repost.active { color: #00ba7c; background: rgba(0, 186, 124, 0.1); }
    .action-btn.like:hover, .action-btn.like.active { color: #f91880; background: rgba(249, 24, 128, 0.1); }
  </style>
</head>
<body>

  <div class="feed">
    <div class="post">
      <div class="header">
        <div class="user-info">
          <div class="avatar">B</div>
          <div>
            <div class="name">bear4w</div>
            <div class="handle">@bear4w</div>
          </div>
        </div>
        <button class="btn-follow" onclick="toggleFollow(this)">Подписаться</button>
      </div>

      <div class="text">
        Мой личный сайт в стиле X (Twitter). Здесь работают фирменные кнопки подписки, ссылки и реакции под постом.
      </div>

      <div>
        <a href="https://t.me" target="_blank" class="btn-blue">Telegram</a>
        <a href="https://github.com" target="_blank" class="btn-outline">GitHub</a>
      </div>

      <div class="actions">
        <button class="action-btn reply" onclick="alert('Раздел комментариев в разработке')">
          <svg viewBox="0 0 24 24"><path d="M1.751 10c0-4.42 3.584-8 8.005-8h4.366c4.49 0 8.129 3.64 8.129 8.13 0 2.96-1.607 5.68-4.196 7.11l-8.054 4.46v-3.69h-.067c-4.49.1-8.183-3.51-8.183-8.01zm8.005-6c-3.317 0-6.005 2.69-6.005 6 0 3.37 2.77 6.08 6.138 6.01l.351-.01h1.761v2.3l5.087-2.81c1.951-1.08 3.163-3.13 3.163-5.36 0-3.39-2.744-6.13-6.129-6.13H9.756z"/></svg>
          <span>12</span>
        </button>

        <button class="action-btn repost" onclick="toggleCount(this)">
          <svg viewBox="0 0 24 24"><path d="M4.5 3.88l4.432 4.14-1.364 1.46L5.5 7.55V16c0 1.1.896 2 2 2H13v2H7.5c-2.209 0-4-1.79-4-4V7.55L1.432 9.48.068 8.02 4.5 3.88zM16.5 6H11V4h5.5c2.209 0 4 1.79 4 4v8.45l2.068-1.93 1.364 1.46-4.432 4.14-4.432-4.14 1.364-1.46 2.068 1.93V8c0-1.1-.896-2-2-2z"/></svg>
          <span>5</span>
        </button>

        <button class="action-btn like" onclick="toggleCount(this)">
          <svg viewBox="0 0 24 24"><path d="M16.697 5.5c-1.222-.06-2.679.51-3.89 2.16l-.805 1.09-.806-1.09C9.984 6.01 8.526 5.44 7.304 5.5c-1.243.07-2.349.78-2.91 1.91-.552 1.12-.633 2.78.479 4.82 1.074 1.97 3.257 4.27 7.129 6.61 3.87-2.34 6.052-4.64 7.126-6.61 1.111-2.04 1.03-3.7.477-4.82-.561-1.13-1.666-1.84-2.908-1.91zm4.187 7.69c-1.351 2.48-4.001 5.12-8.379 7.67l-.503.3-.504-.3c-4.379-2.55-7.029-5.19-8.382-7.67-1.36-2.5-1.41-4.86-.514-6.67.887-1.79 2.647-2.91 4.601-3.01 1.651-.09 3.368.56 4.798 2.01 1.429-1.45 3.146-2.1 4.796-2.01 1.954.1 3.714 1.22 4.601 3.01.896 1.81.846 4.17-.514 6.67z"/></svg>
          <span>48</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    function toggleFollow(btn) {
      btn.classList.toggle('following');
      btn.textContent = btn.classList.contains('following') ? 'Читаю' : 'Подписаться';
    }

    function toggleCount(btn) {
      const span = btn.querySelector('span');
      let count = parseInt(span.textContent, 10);
      btn.classList.toggle('active');
      span.textContent = btn.classList.contains('active') ? count + 1 : count - 1;
    }
  </script>

</body>
</html>
